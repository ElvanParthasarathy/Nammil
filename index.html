<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nammil</title>
  <link rel="preload" href="/Fonts/ElvanSans-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/app_icon.png" as="image" />
  <script>
    (function() {
      function show() {
        document.documentElement.classList.add('fonts-loaded');
      }
      if (document.fonts) {
        document.fonts.load("1em 'Elvan Sans'").then(show).catch(show);
        setTimeout(show, 150);
      } else {
        show();
      }
      try {
        var lang = localStorage.getItem('nammil-language') || 'en';
        window.__INIT_NAME__ = (lang === 'ta' || lang === 'ml_tam') ? 'நம்மில்' : ((lang === 'ml' || lang === 'ta_ml') ? 'നമ്മിൽ' : 'Nammil');
      } catch(e) {}
    })();
  </script>
  <style>
    :root {
      color-scheme: light dark;
    }
    @font-face {
      font-family: 'Elvan Sans';
      src: url('/Fonts/ElvanSans-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0A;
      color: #FFFFFF;
      overflow: hidden;
      user-select: none;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #FAFAFA;
        color: #1A1A1A;
      }
    }
    .splash-screen-root {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0A0A0A;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      opacity: 0;
      transition: opacity 0.12s ease-in-out;
      -webkit-app-region: no-drag;
    }
    .fonts-loaded .splash-screen-root {
      opacity: 1;
    }
    @media (prefers-color-scheme: light) {
      .splash-screen-root {
        background-color: #FAFAFA;
        color: #1A1A1A;
      }
    }
    /* Floating background shapes from Neram */
    .splash-shape {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.03);
      pointer-events: none;
      z-index: 0;
    }
    @media (prefers-color-scheme: light) {
      .splash-shape {
        background-color: #EAEAEA;
      }
    }
    .shape-1 {
      top: 2%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 80px;
      animation: rotate1 60s linear infinite;
      transform-origin: 85% 15%;
    }
    .shape-2 {
      bottom: 5%;
      left: -10%;
      width: 70vw;
      height: 70vw;
      border-radius: 50%;
      animation: float 4s ease-in-out infinite alternate;
    }
    .shape-3 {
      top: 15%;
      left: 5%;
      width: 20vw;
      height: 20vw;
      border-radius: 30px;
      animation: rotate2 40s linear infinite reverse;
    }
    .shape-4 {
      top: 60%;
      right: 10%;
      width: 15vw;
      height: 15vw;
      border-radius: 50%;
      animation: float 5s ease-in-out infinite alternate-reverse;
    }
    @keyframes rotate1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate2 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(-15px); }
    }
    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(0px);
      z-index: 10;
      pointer-events: none;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .splash-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin: 0 0 10px 0 !important;
      padding: 0;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
      user-select: none;
      pointer-events: none;
    }
    .splash-brand-wrap {
      height: 24px;
      min-height: 24px;
      max-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .splash-brand-name {
      font-size: 20px;
      font-weight: 500;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0px;
      line-height: 24px;
      height: 24px;
      margin: 0;
      padding: 0;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      white-space: nowrap;
      display: block;
    }
    @media (prefers-color-scheme: light) {
      .splash-brand-name {
        color: rgba(0, 0, 0, 0.85);
      }
    }
    .splash-footer {
      position: absolute;
      bottom: 47px;
      left: 0;
      right: 0;
      width: 100%;
      height: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      margin: 0;
      padding: 0;
    }
    .splash-footer-brand {
      font-size: 17px;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      letter-spacing: 0px;
      line-height: 22px;
      height: 22px;
      margin: 0;
      padding: 0;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      display: block;
    }
    @media (prefers-color-scheme: light) {
      .splash-footer-brand {
        color: rgba(0, 0, 0, 0.45);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="splash-screen-root">
      <div class="splash-shape shape-1"></div>
      <div class="splash-shape shape-2"></div>
      <div class="splash-shape shape-3"></div>
      <div class="splash-shape shape-4"></div>
      <div class="splash-center">
        <img src="/app_icon.png" alt="Nammil" class="splash-logo" />
        <div class="splash-brand-wrap">
          <span class="splash-brand-name" id="pre-brand-name">Nammil</span>
          <script>
            if (window.__INIT_NAME__) {
              document.getElementById('pre-brand-name').textContent = window.__INIT_NAME__;
            }
          </script>
        </div>
      </div>
      <div class="splash-footer">
        <span class="splash-footer-brand">Elvan Navil</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
