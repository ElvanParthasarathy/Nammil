    /* Full extended font from local disk for remaining rare characters */
    @font-face {
      font-family: 'Elvan Sans';
      src: url('./Fonts/ElvanSans-Regular.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0A;
      color: #FFFFFF;
      overflow: hidden;
      user-select: none;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #FAFAFA;
        color: #1A1A1A;
      }
    }
    html.theme-dark, html.theme-dark body {
      background-color: #0A0A0A;
      color: #FFFFFF;
    }
    html.theme-light, html.theme-light body {
      background-color: #FAFAFA;
      color: #1A1A1A;
    }
    button, input, select, textarea {
      font-family: inherit;
    }

    /* Fixed Splash Overlay: Lives outside #root, never unmounted by React, zero flicker */
    #splash-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0A0A0A;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      z-index: 99999;
      -webkit-app-region: no-drag;
      transition: opacity 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-color-scheme: light) {
      #splash-overlay {
        background-color: #FAFAFA;
        color: #1A1A1A;
      }
    }
    html.theme-dark #splash-overlay {
      background-color: #0A0A0A;
      color: #FFFFFF;
    }
    html.theme-light #splash-overlay {
      background-color: #FAFAFA;
      color: #1A1A1A;
    }

    /* Floating background shapes from Neram */
    .splash-shape {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.03);
      pointer-events: none;
      z-index: 0;
    }
    @media (prefers-color-scheme: light) {
      .splash-shape {
        background-color: #EAEAEA;
      }
    }
    html.theme-dark .splash-shape {
      background-color: rgba(255, 255, 255, 0.03);
    }
    html.theme-light .splash-shape {
      background-color: #EAEAEA;
    }
    .shape-1 {
      top: 2%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 80px;
      animation: rotate1 60s linear infinite;
      transform-origin: 85% 15%;
    }
    .shape-2 {
      bottom: 5%;
      left: -10%;
      width: 70vw;
      height: 70vw;
      border-radius: 50%;
      animation: float 4s ease-in-out infinite alternate;
    }
    .shape-3 {
      top: 15%;
      left: 5%;
      width: 20vw;
      height: 20vw;
      border-radius: 30px;
      animation: rotate2 40s linear infinite reverse;
    }
    .shape-4 {
      top: 60%;
      right: 10%;
      width: 15vw;
      height: 15vw;
      border-radius: 50%;
      animation: float 5s ease-in-out infinite alternate-reverse;
    }
    @keyframes rotate1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate2 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(-15px); }
    }

    /* Center Content */
    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(0px);
      z-index: 10;
      pointer-events: none;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .splash-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin: 0 !important;
      padding: 0;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
      user-select: none;
      pointer-events: none;
    }
    @media (prefers-color-scheme: light) {
      .splash-logo {
        filter: none;
      }
    }
    html.theme-light .splash-logo {
      filter: none;
    }
    html.theme-dark .splash-logo {
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
    }

    /* Footer */
    .splash-footer {
      position: absolute;
      bottom: 47px;
      left: 0;
      right: 0;
      width: 100%;
      height: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      margin: 0;
      padding: 0;
    }
    .splash-footer-brand {
      font-size: 17px;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      letter-spacing: 0px;
      line-height: 22px;
      height: 22px;
      margin: 0;
      padding: 0;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      display: block;
    }
    @media (prefers-color-scheme: light) {
      .splash-footer-brand {
        color: rgba(0, 0, 0, 0.45);
      }
    }
    html.theme-dark .splash-footer-brand {
      color: rgba(255, 255, 255, 0.45);
    }
    html.theme-light .splash-footer-brand {
      color: rgba(0, 0, 0, 0.45);
    }
  </style>
  <script>
    // Early theme & language sync from localStorage
    try {
      var savedTheme = localStorage.getItem('nammil-theme');
      if (savedTheme === 'light') document.documentElement.classList.add('theme-light');
      else if (savedTheme === 'dark') document.documentElement.classList.add('theme-dark');
    } catch(e) {}
  </script>
</head>
<body>
  <!-- Fixed splash overlay: Never destroyed by React mounting, zero flicker -->
  <div id="splash-overlay">
    <div class="splash-shape shape-1"></div>
    <div class="splash-shape shape-2"></div>
    <div class="splash-shape shape-3"></div>
    <div class="splash-shape shape-4"></div>
    <div class="splash-center">
      <img src="./app_icon.png" alt="" class="splash-logo" />
    </div>
    <div class="splash-footer">
      <span class="splash-footer-brand">Elvan Navil</span>
    </div>
  </div>
  <script>
    (function() {
      try {
        var brandMap = {
          'ta': 'எல்வன் நவில்',
          'ta_ml': 'എൽവൻ നവിൽ',
          'ml': 'എൽവൻ നവിൽ',
          'ml_tam': 'எல்வன் நவில்',
          'en': 'Elvan Navil',
          'ta_latn': 'Elvan Navil',
          'ml_latn': 'Elvan Navil'
        };
        var savedLang = localStorage.getItem('nammil-language');
        if (!savedLang || savedLang === 'system') {
          var navLang = (navigator.language || '').toLowerCase();
          savedLang = navLang.startsWith('ta') ? 'ta' : 'en';
        }
        if (savedLang && brandMap[savedLang]) {
          var brandEl = document.querySelector('#splash-overlay .splash-footer-brand');
          if (brandEl) brandEl.textContent = brandMap[savedLang];
        }
      } catch(e) {}
    })();
  </script>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    (function() {
      var splashOverlay = document.getElementById('splash-overlay');

      window.__dismissSplash = function() {
        if (!splashOverlay) return;
        splashOverlay.style.opacity = '0';
        splashOverlay.style.pointerEvents = 'none';
        setTimeout(function() {
          if (splashOverlay && splashOverlay.parentNode) {
            splashOverlay.parentNode.removeChild(splashOverlay);
          }
        }, 220);
      };
    })();
  </script>
</body>
</html>
