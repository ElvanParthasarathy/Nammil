<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nammil</title>
  <style>
    :root {
      color-scheme: light dark;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0A;
      color: #FFFFFF;
      overflow: hidden;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #FAFAFA;
        color: #1A1A1A;
      }
    }
    .pre-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .pre-logo {
      width: 75px;
      height: 75px;
      object-fit: contain;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
    }
    .pre-footer {
      position: absolute;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      opacity: 0.6;
    }
    .pre-footer-from {
      font-size: 12px;
      letter-spacing: 1px;
    }
    .pre-footer-brand {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="pre-splash">
      <img src="/app_icon.png" alt="Nammil" class="pre-logo" />
      <div class="pre-footer">
        <span class="pre-footer-from">from</span>
        <span class="pre-footer-brand">Elvan Navil</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
