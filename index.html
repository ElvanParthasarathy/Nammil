<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nammil</title>
  <link rel="preload" href="/Fonts/ElvanSans-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="/app_icon.png" as="image" />
  <style>
    :root {
      color-scheme: light dark;
    }
    @font-face {
      font-family: 'Elvan Sans';
      src: url('/Fonts/ElvanSans-Regular.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0A;
      color: #FFFFFF;
      overflow: hidden;
      user-select: none;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #FAFAFA;
        color: #1A1A1A;
      }
    }
    .pre-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
    }
    /* Floating background shapes from Neram */
    .pre-shape {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.03);
      pointer-events: none;
      z-index: 0;
    }
    @media (prefers-color-scheme: light) {
      .pre-shape {
        background-color: #EAEAEA;
      }
    }
    .shape-1 {
      top: 2%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 80px;
      animation: rotate1 60s linear infinite;
      transform-origin: 85% 15%;
    }
    .shape-2 {
      bottom: 5%;
      left: -10%;
      width: 70vw;
      height: 70vw;
      border-radius: 50%;
      animation: float 4s ease-in-out infinite alternate;
    }
    .shape-3 {
      top: 15%;
      left: 5%;
      width: 20vw;
      height: 20vw;
      border-radius: 30px;
      animation: rotate2 40s linear infinite reverse;
    }
    .shape-4 {
      top: 60%;
      right: 10%;
      width: 15vw;
      height: 15vw;
      border-radius: 50%;
      animation: float 5s ease-in-out infinite alternate-reverse;
    }
    @keyframes rotate1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate2 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(-15px); }
    }
    .pre-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(-20px);
      z-index: 1;
    }
    .pre-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      margin-bottom: 16px;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25));
    }
    .pre-name {
      font-size: 28px;
      font-weight: 600;
      font-family: 'Elvan Sans', sans-serif;
      letter-spacing: -0.2px;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
    }
    @media (prefers-color-scheme: light) {
      .pre-name {
        color: rgba(0, 0, 0, 0.85);
      }
    }
    .pre-footer {
      position: absolute;
      bottom: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
    }
    .pre-footer-brand {
      font-size: 18px;
      font-family: 'Elvan Sans', sans-serif;
      font-weight: 500;
      letter-spacing: -0.2px;
      color: rgba(255, 255, 255, 0.4);
    }
    @media (prefers-color-scheme: light) {
      .pre-footer-brand {
        color: rgba(0, 0, 0, 0.4);
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="pre-splash">
      <div class="pre-shape shape-1"></div>
      <div class="pre-shape shape-2"></div>
      <div class="pre-shape shape-3"></div>
      <div class="pre-shape shape-4"></div>
      <div class="pre-center">
        <img src="/app_icon.png" alt="Nammil" class="pre-logo" />
        <div class="pre-name">Nammil</div>
      </div>
      <div class="pre-footer">
        <span class="pre-footer-brand">Elvan Navil</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
