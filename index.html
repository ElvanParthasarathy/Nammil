<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nammil</title>
  <link rel="preload" href="./Fonts/ElvanSans-Regular.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="./app_icon.png" as="image" />
  <style>
    :root {
      color-scheme: light dark;
    }
    @font-face {
      font-family: 'Elvan Sans';
      src: url('./Fonts/ElvanSans-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Elvan Sans';
      src: url('./Fonts/ElvanSans-Regular.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: 'Elvan Sans';
      src: url('./Fonts/ElvanSans-Regular.ttf') format('truetype');
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0A0A0A;
      color: #FFFFFF;
      overflow: hidden;
      user-select: none;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      html, body {
        background-color: #FAFAFA;
        color: #1A1A1A;
      }
    }
    html.theme-dark, html.theme-dark body {
      background-color: #0A0A0A;
      color: #FFFFFF;
    }
    html.theme-light, html.theme-light body {
      background-color: #FAFAFA;
      color: #1A1A1A;
    }

    /* Fixed Splash Overlay: Lives outside #root, never unmounted by React, zero flicker */
    #splash-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0A0A0A;
      color: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      overflow: hidden;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      z-index: 99999;
      -webkit-app-region: no-drag;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (prefers-color-scheme: light) {
      #splash-overlay {
        background-color: #FAFAFA;
        color: #1A1A1A;
      }
    }
    html.theme-dark #splash-overlay {
      background-color: #0A0A0A;
      color: #FFFFFF;
    }
    html.theme-light #splash-overlay {
      background-color: #FAFAFA;
      color: #1A1A1A;
    }

    /* Floating background shapes from Neram */
    .splash-shape {
      position: absolute;
      background-color: rgba(255, 255, 255, 0.03);
      pointer-events: none;
      z-index: 0;
    }
    @media (prefers-color-scheme: light) {
      .splash-shape {
        background-color: #EAEAEA;
      }
    }
    html.theme-dark .splash-shape {
      background-color: rgba(255, 255, 255, 0.03);
    }
    html.theme-light .splash-shape {
      background-color: #EAEAEA;
    }
    .shape-1 {
      top: 2%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      border-radius: 80px;
      animation: rotate1 60s linear infinite;
      transform-origin: 85% 15%;
    }
    .shape-2 {
      bottom: 5%;
      left: -10%;
      width: 70vw;
      height: 70vw;
      border-radius: 50%;
      animation: float 4s ease-in-out infinite alternate;
    }
    .shape-3 {
      top: 15%;
      left: 5%;
      width: 20vw;
      height: 20vw;
      border-radius: 30px;
      animation: rotate2 40s linear infinite reverse;
    }
    .shape-4 {
      top: 60%;
      right: 10%;
      width: 15vw;
      height: 15vw;
      border-radius: 50%;
      animation: float 5s ease-in-out infinite alternate-reverse;
    }
    @keyframes rotate1 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotate2 {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes float {
      from { transform: translateY(0px); }
      to { transform: translateY(-15px); }
    }

    /* Center Content */
    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transform: translateY(0px);
      z-index: 10;
      pointer-events: none;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .splash-logo {
      width: 82px;
      height: 82px;
      object-fit: contain;
      margin: 0 0 10px 0 !important;
      padding: 0;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
      user-select: none;
      pointer-events: none;
    }

    /* Brand Name Wrapper */
    .splash-brand-wrap {
      height: 24px;
      min-height: 24px;
      max-height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .splash-brand-name {
      font-size: 20px;
      font-weight: 500;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0px;
      line-height: 24px;
      height: 24px;
      margin: 0;
      padding: 0;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      white-space: nowrap;
      display: block;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }
    @media (prefers-color-scheme: light) {
      .splash-brand-name {
        color: rgba(0, 0, 0, 0.85);
      }
    }
    html.theme-dark .splash-brand-name {
      color: rgba(255, 255, 255, 0.9);
    }
    html.theme-light .splash-brand-name {
      color: rgba(0, 0, 0, 0.85);
    }

    /* Footer */
    .splash-footer {
      position: absolute;
      bottom: 47px;
      left: 0;
      right: 0;
      width: 100%;
      height: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      margin: 0;
      padding: 0;
    }
    .splash-footer-brand {
      font-size: 17px;
      font-family: 'Elvan Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-weight: 400;
      letter-spacing: 0px;
      line-height: 22px;
      height: 22px;
      margin: 0;
      padding: 0;
      color: rgba(255, 255, 255, 0.45);
      text-align: center;
      display: block;
      opacity: 0;
      transition: opacity 0.25s ease-in-out;
    }
    @media (prefers-color-scheme: light) {
      .splash-footer-brand {
        color: rgba(0, 0, 0, 0.45);
      }
    }
    html.theme-dark .splash-footer-brand {
      color: rgba(255, 255, 255, 0.45);
    }
    html.theme-light .splash-footer-brand {
      color: rgba(0, 0, 0, 0.45);
    }
  </style>
  <script>
    // Early theme & language sync from localStorage
    try {
      var savedTheme = localStorage.getItem('nammil-theme');
      if (savedTheme === 'light') document.documentElement.classList.add('theme-light');
      else if (savedTheme === 'dark') document.documentElement.classList.add('theme-dark');
    } catch(e) {}

    // Preload & decode font immediately on frame 0
    window.__fontPromise = (document.fonts && document.fonts.load)
      ? Promise.all([
          document.fonts.load("500 20px 'Elvan Sans'"),
          document.fonts.load("400 17px 'Elvan Sans'"),
          document.fonts.ready
        ])
      : Promise.resolve();
  </script>
</head>
<body>
  <!-- Fixed splash overlay: Never destroyed by React mounting, zero flicker -->
  <div id="splash-overlay">
    <div class="splash-shape shape-1"></div>
    <div class="splash-shape shape-2"></div>
    <div class="splash-shape shape-3"></div>
    <div class="splash-shape shape-4"></div>
    <div class="splash-center">
      <img src="./app_icon.png" alt="Nammil" class="splash-logo" />
      <div class="splash-brand-wrap">
        <span class="splash-brand-name" id="splash-brand-name"></span>
      </div>
    </div>
    <div class="splash-footer">
      <span class="splash-footer-brand" id="splash-footer-brand">Elvan Navil</span>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <script>
    (function() {
      var BRAND_NAMES = { ta: 'நம்மில்', en: 'Nammil', ml: 'നമ്മിൽ' };
      var LANG_ORDER = {
        ta: ['ta', 'en', 'ml'],
        ta_latn: ['en', 'ta', 'ml'],
        ta_ml: ['ml', 'ta', 'en'],
        en: ['en', 'ta', 'ml'],
        ml: ['ml', 'en', 'ta'],
        ml_latn: ['en', 'ml', 'ta'],
        ml_tam: ['ta', 'ml', 'en'],
        system: ['en', 'ta', 'ml']
      };

      var userLang = 'en';
      try {
        userLang = localStorage.getItem('nammil-language') || 'en';
      } catch(e) {}
      var order = LANG_ORDER[userLang] || LANG_ORDER['en'];

      var brandEl = document.getElementById('splash-brand-name');
      var footerEl = document.getElementById('splash-footer-brand');
      var splashOverlay = document.getElementById('splash-overlay');

      // Phase 1: In first, ONLY LOGO ALONE is shown! (0ms - 400ms)
      // Phase 2: After only, the text appears and cycles once font is fully ready!
      var minDelay = new Promise(function(resolve) {
        setTimeout(resolve, 400);
      });
      var fontTimeout = new Promise(function(resolve) {
        setTimeout(resolve, 800);
      });
      var fontReady = Promise.race([window.__fontPromise || Promise.resolve(), fontTimeout]);

      Promise.all([minDelay, fontReady]).then(function() {
        if (brandEl) {
          brandEl.textContent = BRAND_NAMES[order[0]] || 'Nammil';
          brandEl.style.opacity = '1';
        }
        if (footerEl) {
          footerEl.style.opacity = '1';
        }

        // Cycle through remaining languages
        var idx = 0;
        function nextLanguage() {
          if (idx < order.length - 1) {
            setTimeout(function() {
              if (brandEl) brandEl.style.opacity = '0';
              setTimeout(function() {
                idx++;
                if (brandEl) {
                  brandEl.textContent = BRAND_NAMES[order[idx]] || 'Nammil';
                  brandEl.style.opacity = '1';
                }
                nextLanguage();
              }, 220);
            }, 550);
          } else {
            // Finished cycle — hold for 400ms, then dispatch splash-finished
            setTimeout(function() {
              window.dispatchEvent(new CustomEvent('splash-finished'));
            }, 400);
          }
        }
        nextLanguage();
      });

      window.__dismissSplash = function() {
        if (!splashOverlay) return;
        splashOverlay.style.opacity = '0';
        splashOverlay.style.pointerEvents = 'none';
        setTimeout(function() {
          if (splashOverlay && splashOverlay.parentNode) {
            splashOverlay.parentNode.removeChild(splashOverlay);
          }
        }, 450);
      };
    })();
  </script>
</body>
</html>
